# Lets a human revise an OPEN PR by mentioning the agent in a comment or review:
#
#     @agent tighten the error message and add a test for the empty-input case
#
# `@claude` works too, so existing habits keep working regardless of which provider the
# repo runs. The job checks out the PR's head branch, reads everything after the mention
# as its instruction, makes the change, and pushes back to the same branch — re-running CI.
#
# This closes the in-PR feedback loop; the base trigger is one-shot-per-issue. It fires
# only for collaborators with write/admin access (gate below), and bot pushes don't
# re-trigger workflows (GITHUB_TOKEN suppression), so there is no loop.
#
# Provider-agnostic: runs through .github/actions/agent-run (claude / openai / gemini).

name: Agent PR Feedback

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  agent-pr-feedback:
    if: |
      vars.AGENT_PROVIDER != 'custom' && vars.AGENT_PROVIDER != 'copilot' && (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request != null &&
          (contains(github.event.comment.body, '@agent') || contains(github.event.comment.body, '@claude'))) ||
        (github.event_name == 'pull_request_review_comment' &&
          (contains(github.event.comment.body, '@agent') || contains(github.event.comment.body, '@claude'))) ||
        (github.event_name == 'pull_request_review' && github.event.review.body != null &&
          (contains(github.event.review.body, '@agent') || contains(github.event.review.body, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Optional human-approval gate. OFF by default (no required reviewers on the
    # environment). Add Required reviewers in Settings → Environments to enable; rename via
    # the AGENT_ENVIRONMENT repo variable. See docs/SECURITY.md.
    environment: ${{ vars.AGENT_ENVIRONMENT || 'agent' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      # Authorization gate: only repo collaborators with write/admin may drive the agent.
      # Without this, on a public repo ANY user could comment "@agent …" and run an agent
      # with write access in full-auto mode. Mirrors plan-approval-gate.yml.
      - name: Check commenter permissions
        id: permission-check
        uses: actions/github-script@v9
        with:
          script: |
            const p = context.payload;
            const commenter = (p.comment && p.comment.user.login) || (p.review && p.review.user.login);
            const prNumber = (p.issue && p.issue.number) || (p.pull_request && p.pull_request.number);
            let permLevel = 'none';
            try {
              const r = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner, repo: context.repo.repo, username: commenter,
              });
              permLevel = r.data.permission;
            } catch (err) {
              permLevel = 'none';
            }
            const allowed = ['write', 'admin'].includes(permLevel);
            console.log(`Commenter ${commenter} has permission: ${permLevel} — allowed: ${allowed}`);
            if (!allowed && prNumber) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber,
                body: `@${commenter} Only collaborators with write access can drive the agent here — request ignored.`,
              });
            }
            core.setOutput('allowed', allowed ? 'true' : 'false');

      # Resolve the PR to work on and pull the instruction out of the mention. Fork PRs
      # are refused: the job token can't push to another account's branch, so the run
      # would burn tokens and then fail at the push.
      - name: Resolve PR context and instruction
        id: ctx
        if: steps.permission-check.outputs.allowed == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const p = context.payload;
            const prNumber = (p.issue && p.issue.number) || (p.pull_request && p.pull_request.number);
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: prNumber,
            });

            if (pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber,
                body: 'This PR comes from a fork, so the agent cannot push to its branch. Pull the branch locally, or push it to this repo, and mention the agent again.',
              });
              core.setOutput('proceed', 'false');
              return;
            }

            const raw = (p.comment && p.comment.body) || (p.review && p.review.body) || '';
            // Everything after the mention is the instruction; drop the mention itself.
            const instruction = raw.replace(/@(agent|claude)\b/gi, '').trim();

            core.setOutput('proceed', 'true');
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('instruction', instruction);

      - name: Checkout PR branch
        if: steps.ctx.outputs.proceed == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ctx.outputs.head_ref }}
          fetch-depth: 0

      # COST: PR fixes run on the standard work tier. See docs/COST.md.
      - name: Apply the requested change
        if: steps.ctx.outputs.proceed == 'true'
        uses: ./.github/actions/agent-run
        with:
          provider: ${{ vars.AGENT_PROVIDER }}
          model: ${{ vars.AGENT_MODEL }}
          default_model: sonnet
          max_turns: ${{ vars.AGENT_MAX_TURNS }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          push_branch: ${{ steps.ctx.outputs.head_ref }}
          commit_message: 'fix(agent): address review feedback on #${{ steps.ctx.outputs.pr_number }}'
          prompt: |
            A reviewer has requested a change to pull request #${{ steps.ctx.outputs.pr_number }}
            in ${{ github.repository }}. Its head branch, "${{ steps.ctx.outputs.head_ref }}",
            is already checked out in your working directory.

            Their request:

            ---
            ${{ steps.ctx.outputs.instruction }}
            ---

            Instructions:
            1. Read the PR to understand what it does and what the request refers to:
               gh pr diff ${{ steps.ctx.outputs.pr_number }} --repo ${{ github.repository }}
            2. Read CLAUDE.md at the repo root — it is this project's agent guide, whatever
               agent you are (AGENTS.md and GEMINI.md point at it). Read docs/LEARNINGS.md too.
            3. Make exactly the change that was requested. Do not refactor unrelated code,
               and do not expand the PR's scope.
            4. Update or add tests for any behavior you change.
            5. Commit to the current branch and push it, so the PR updates and CI re-runs.
            6. If the request is ambiguous or you think it's wrong, comment on the PR asking
               rather than guessing.
