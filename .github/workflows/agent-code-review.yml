# Automated PR review by the configured agent. OPT-IN and cost-aware by design.
#
# Off unless you turn it on. It posts a single review comment per PR; it never pushes code
# (the job token is contents: read) and never approves or merges.
#
# Enable:  set repository variable ENABLE_AGENT_REVIEW = true
#          (the older ENABLE_CLAUDE_REVIEW is still honored)
# Model:   set AGENT_REVIEW_MODEL. On Claude this defaults to `sonnet`:
#            haiku  → cheapest, light review
#            sonnet → balanced (default)
#            opus   → deepest, most expensive
#          On OpenAI/Gemini, leaving it unset uses that CLI's own default model.
#
# Cost levers built in (see docs/COST.md):
#   • Opt-in toggle — the whole workflow is off by default.
#   • Parameterized model — pick the tier that fits the repo.
#   • paths-ignore — skips docs-only / lockfile-only PRs that don't need a code review.
#   • Draft skip — no spend on drafts.
#   • concurrency cancel-in-progress — a new push cancels the stale review run.
#   • timeout-minutes + optional AGENT_MAX_TURNS — bound a runaway review.

name: Agent Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    # Don't spend a review on changes that aren't code. Tune to your repo.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '**/*.lock'
      - 'package-lock.json'
      - 'go.sum'

# A new push to the PR cancels the in-flight review — you only pay for the latest.
concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  review:
    # Opt-in + a hosted provider + not a draft + not a fork.
    # Fork PRs run without repo secrets under `pull_request`, so skip them explicitly
    # rather than starting a run that can only fail at the credential check.
    if: |
      (vars.ENABLE_AGENT_REVIEW == 'true' || vars.ENABLE_CLAUDE_REVIEW == 'true') &&
      vars.AGENT_PROVIDER != 'custom' &&
      vars.AGENT_PROVIDER != 'copilot' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read          # read-only: a reviewer never pushes code
      pull-requests: write    # post the review comment
      actions: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No push_branch is passed, so the safety net stays off — this job only comments.
      - name: Review the pull request
        uses: ./.github/actions/agent-run
        with:
          provider: ${{ vars.AGENT_PROVIDER }}
          model: ${{ vars.AGENT_REVIEW_MODEL }}
          default_model: sonnet
          max_turns: ${{ vars.AGENT_MAX_TURNS }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You are reviewing pull request #${{ github.event.pull_request.number }}
            ("${{ github.event.pull_request.title }}") in ${{ github.repository }}.

            Keep this review focused and economical — you are a cost-aware reviewer.

            Steps:
            1. Read the diff:
               gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }}
            2. Read CLAUDE.md (this project's agent guide, whatever agent you are) and
               docs/LEARNINGS.md, so your review reflects this project's conventions and
               known failure modes.
            3. Review for, in priority order:
               - Correctness bugs and broken edge cases
               - Security issues (injection, secrets, authz, unsafe input handling)
               - Scope drift vs. the linked issue / "Out of scope"
               - Missing or weak tests for the behavior changed
               - Violations of the conventions in CLAUDE.md
            4. Post exactly ONE review comment on the PR (do NOT spam multiple comments,
               and do NOT push code). Start it with the marker line:
                 <!-- agent-code-review -->
               If a previous comment with that marker exists, edit it instead of adding
               a new one. Structure it as: a one-line verdict, then a short bulleted list
               of concrete findings (file:line where possible), then "Nits" if any.
               If the PR looks good, say so briefly — don't invent problems to list.
            5. Do NOT approve or request-changes formally; a human owns the merge decision.

            Be concise. A tight, high-signal review is cheaper and more useful than an
            exhaustive one.
