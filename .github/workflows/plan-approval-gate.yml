# Listens for '/approve-plan' on an issue and implements the approved plan.
#
# Second half of the complexity:high flow:
#   1. agent-ready-trigger.yml runs the agent in plan-only mode; it writes a plan to
#      docs/plans/ on a plan/issue-N branch and asks for approval.
#   2. A human with write/admin access comments /approve-plan.
#   3. This workflow verifies that access, then implements the plan and opens a PR.
#
# Provider-agnostic: the work runs through .github/actions/agent-run, so it uses whichever
# of claude / openai / gemini the AGENT_PROVIDER variable selects.
#
# The prompt is direct, not a slash command — slash commands do NOT resolve in headless
# CI runs (see docs/LEARNINGS.md).

name: Plan Approval Gate

on:
  issue_comment:
    types: [created]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  handle-approve-plan:
    if: |
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, '/approve-plan') &&
      vars.AGENT_PROVIDER != 'custom' &&
      vars.AGENT_PROVIDER != 'copilot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Optional human-approval gate. OFF by default (no required reviewers on the
    # environment). Add Required reviewers in Settings → Environments to enable; rename via
    # the AGENT_ENVIRONMENT repo variable. See docs/SECURITY.md.
    environment: ${{ vars.AGENT_ENVIRONMENT || 'agent' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Authorization gate: anyone can comment on a public repo, but only collaborators
      # may spend money and push code. Mirrors agent-pr-feedback.yml.
      - name: Check commenter permissions
        id: permission-check
        uses: actions/github-script@v9
        with:
          script: |
            const commenter = context.payload.comment.user.login;
            const issueNumber = context.payload.issue.number;
            let permLevel;
            try {
              const result = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner, repo: context.repo.repo, username: commenter
              });
              permLevel = result.data.permission;
            } catch (err) {
              permLevel = 'none';
            }
            const allowed = ['write', 'admin'].includes(permLevel);
            console.log(`Commenter ${commenter} has permission: ${permLevel} — allowed: ${allowed}`);
            if (!allowed) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber,
                body: `@${commenter} Only collaborators with write access can approve plans. Your approval was not processed.`
              });
            }
            core.setOutput('allowed', allowed ? 'true' : 'false');

      - name: Check for existing PR (idempotency)
        id: pr-check
        if: steps.permission-check.outputs.allowed == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open'
            });
            const existing = prs.find(pr => pr.body && (
              pr.body.includes(`Closes #${issueNumber}`) || pr.body.includes(`closes #${issueNumber}`) ||
              pr.body.includes(`Fixes #${issueNumber}`)  || pr.body.includes(`fixes #${issueNumber}`)
            ));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber,
                body: `Implementation is already in progress: ${existing.html_url}`
              });
              core.setOutput('already_running', 'true');
            } else {
              core.setOutput('already_running', 'false');
            }

      # COST: implementing an approved plan runs on the standard work tier. See docs/COST.md.
      - name: Implement the approved plan
        if: |
          steps.permission-check.outputs.allowed == 'true' &&
          steps.pr-check.outputs.already_running == 'false'
        uses: ./.github/actions/agent-run
        with:
          provider: ${{ vars.AGENT_PROVIDER }}
          model: ${{ vars.AGENT_MODEL }}
          default_model: sonnet
          max_turns: ${{ vars.AGENT_MAX_TURNS }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          push_branch: agent/issue-${{ github.event.issue.number }}
          commit_message: 'feat(agent): implement approved plan for #${{ github.event.issue.number }}'
          open_pr: 'true'
          pr_title: ${{ github.event.issue.title }}
          pr_body: |
            Closes #${{ github.event.issue.number }}

            Implements the plan approved on the issue. Review against the issue's acceptance
            criteria before merging.
          pr_labels: agent-generated
          prompt: |
            You are implementing issue #${{ github.event.issue.number }}.

            Issue title: ${{ github.event.issue.title }}

            A human has approved the plan for this issue. Your job is to implement it.

            Instructions:
            1. Read the full issue body for requirements and scope:
               gh issue view ${{ github.event.issue.number }} --repo ${{ github.repository }}
            2. Read CLAUDE.md at the repo root — it is this project's agent guide, whatever
               agent you are (AGENTS.md and GEMINI.md point at it). Read docs/LEARNINGS.md too.
            3. Find the approved plan file in docs/plans/ that corresponds to this issue
               (the most recent matching plan — check file dates and titles) and follow it.
               It may live on the branch plan/issue-${{ github.event.issue.number }}.
               If no plan file exists, implement directly from the issue.
            4. Implement the feature following the plan and the issue's acceptance criteria.
            5. Create a branch, commit, and open a PR:
               - Branch name: agent/issue-${{ github.event.issue.number }}
               - PR title should match the issue title
               - PR body: include "Closes #${{ github.event.issue.number }}" (keep the #) and a summary
               - Use .github/PULL_REQUEST_TEMPLATE/agent-generated.md if it exists
            6. Add the 'agent-generated' label to the PR.

            Important:
            - Stay within the issue's defined scope ("Out of scope" is a hard boundary).
            - If blocked or uncertain, comment on the issue asking for clarification
              rather than guessing.
