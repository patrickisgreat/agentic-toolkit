# Fires when an issue receives the 'agent-ready' label, and routes it by complexity.
#
#   complexity:high                   → the agent PLANS, a human approves with /approve-plan
#                                       (plan-approval-gate.yml), then it implements.
#   complexity:low/medium (or absent) → the agent implements directly and opens a PR.
#
# The agent itself is chosen by the AGENT_PROVIDER repository variable and run through
# .github/actions/agent-run:
#   claude (default) → Claude Code       secret: CLAUDE_CODE_OAUTH_TOKEN / ANTHROPIC_API_KEY
#   openai           → OpenAI Codex CLI  secret: OPENAI_API_KEY
#   gemini           → Google Gemini CLI secret: GEMINI_API_KEY
#   custom           → repository_dispatch, for a listener you write yourself
#
# Prompts are direct and explicit — slash commands do NOT resolve in headless CI runs
# (see docs/LEARNINGS.md).
#
# Setup:
#   1. Add the secret for your provider (Settings → Secrets and variables → Secrets)
#   2. Optionally set AGENT_PROVIDER (Variables). Unset means claude.
#   3. Run the Setup Labels workflow once to create the labels.

name: Agent-Ready Auto-Trigger

on:
  issues:
    types: [labeled]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # HOSTED PROVIDERS — claude / openai / gemini
  # ─────────────────────────────────────────────────────────────────────────────
  trigger-agent:
    if: |
      github.event.label.name == 'agent-ready' &&
      vars.AGENT_PROVIDER != 'custom' &&
      vars.AGENT_PROVIDER != 'copilot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Optional human-approval gate. OFF by default: the auto-created environment has no
    # required reviewers, so the job runs immediately. To require sign-off before any agent
    # run, add Required reviewers to this environment (Settings → Environments). Rename it
    # with the AGENT_ENVIRONMENT repo variable. See docs/SECURITY.md.
    environment: ${{ vars.AGENT_ENVIRONMENT || 'agent' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine complexity
        id: complexity
        uses: actions/github-script@v9
        with:
          script: |
            const labels = context.payload.issue.labels.map(l => l.name);
            const isHigh = labels.includes('complexity:high');
            console.log('Issue labels:', labels.join(', '));
            console.log('complexity:high:', isHigh);
            core.setOutput('is_high', isHigh ? 'true' : 'false');

      # ── HIGH COMPLEXITY: plan first, then gate on /approve-plan ──────────────
      # COST: planning is rare and high-leverage — a bad plan wastes a whole
      # implementation — so Claude defaults to the strongest tier here. See docs/COST.md.
      - name: Planning phase (complexity:high)
        if: steps.complexity.outputs.is_high == 'true'
        uses: ./.github/actions/agent-run
        with:
          provider: ${{ vars.AGENT_PROVIDER }}
          model: ${{ vars.AGENT_PLAN_MODEL }}
          default_model: opus
          max_turns: ${{ vars.AGENT_MAX_TURNS }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          push_branch: plan/issue-${{ github.event.issue.number }}
          commit_message: 'docs(plan): implementation plan for #${{ github.event.issue.number }}'
          prompt: |
            You are planning the implementation for issue #${{ github.event.issue.number }}.

            Issue title: ${{ github.event.issue.title }}

            This is a complexity:high issue. Your job is to PLAN, not implement.

            Instructions:
            1. Read the full issue body:
               gh issue view ${{ github.event.issue.number }} --repo ${{ github.repository }}
            2. Read CLAUDE.md at the repo root — it is this project's agent guide, whatever
               agent you are (AGENTS.md and GEMINI.md point at it). Read docs/LEARNINGS.md too.
            3. Read the key files referenced in Technical Notes to understand the codebase
            4. Write a structured implementation plan as a markdown file saved to:
               docs/plans/YYYY-MM-DD-NNN-<type>-<short-title>-plan.md
               The plan should include: problem frame, requirements, scope boundaries,
               key technical decisions, and implementation units (each with goal, files,
               approach, and test scenarios)
            5. Commit the plan file to a new branch named:
               plan/issue-${{ github.event.issue.number }}
            6. After committing, post a comment on the issue with:
               - A link to the plan file (GitHub URL)
               - "Implementation plan is ready for review. Reply /approve-plan to begin
                 implementation, or comment with feedback to revise the plan."
            7. Do NOT write any application code
            8. Do NOT open a pull request

      # ── LOW/MEDIUM COMPLEXITY: implement directly ────────────────────────────
      # COST: routine implementation runs on the mid tier by default. See docs/COST.md.
      - name: Direct execution (complexity:low/medium)
        if: steps.complexity.outputs.is_high == 'false'
        uses: ./.github/actions/agent-run
        with:
          provider: ${{ vars.AGENT_PROVIDER }}
          model: ${{ vars.AGENT_MODEL }}
          default_model: sonnet
          max_turns: ${{ vars.AGENT_MAX_TURNS }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          push_branch: agent/issue-${{ github.event.issue.number }}
          commit_message: 'feat(agent): implement #${{ github.event.issue.number }}'
          open_pr: 'true'
          pr_title: ${{ github.event.issue.title }}
          pr_body: |
            Closes #${{ github.event.issue.number }}

            Implemented by the agentic-toolkit agent. Review against the issue's acceptance
            criteria before merging.
          pr_labels: agent-generated
          prompt: |
            You are implementing issue #${{ github.event.issue.number }}.

            Issue title: ${{ github.event.issue.title }}

            Instructions:
            1. Read the full issue body carefully using the GitHub CLI:
               gh issue view ${{ github.event.issue.number }} --repo ${{ github.repository }}
            2. Read CLAUDE.md at the repo root — it is this project's agent guide, whatever
               agent you are (AGENTS.md and GEMINI.md point at it). Read docs/LEARNINGS.md too.
            3. Implement the feature following the acceptance criteria exactly
            4. Stay within the defined scope — "Out of scope" is a hard boundary
            5. Follow the patterns referenced in Technical Notes (read the key files listed there)
            6. Create a branch, commit your changes, and open a PR:
               - Branch name: agent/issue-${{ github.event.issue.number }}
               - PR title should match the issue title
               - PR body: reference "Closes #${{ github.event.issue.number }}" and summarize what you did
               - Use the template at .github/PULL_REQUEST_TEMPLATE/agent-generated.md if it exists
            7. Add the 'agent-generated' label to the PR
            8. After the PR is open, update the original issue's acceptance criteria:
               - Check off any criteria your implementation directly satisfies
               - Leave unchecked anything that requires manual testing, human review, or CI
               - Use gh issue edit to update the checkbox state in the issue body

            If you are blocked or unclear on something, post a comment on the issue
            asking for clarification rather than guessing.

      - name: Report setup failure on the issue
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: [
                '⚠️ **The agent run failed**',
                '',
                'The most common cause is a missing provider secret. Check that the secret for your',
                '`AGENT_PROVIDER` is set under **Settings → Secrets and variables → Secrets**:',
                '',
                '| `AGENT_PROVIDER` | Required secret |',
                '| --- | --- |',
                '| `claude` _(default)_ | `CLAUDE_CODE_OAUTH_TOKEN` or `ANTHROPIC_API_KEY` |',
                '| `openai` | `OPENAI_API_KEY` |',
                '| `gemini` | `GEMINI_API_KEY` |',
                '',
                'Otherwise, open the failed run in the Actions tab for the real error.',
                '',
                'See the [README](../blob/main/README.md) for setup instructions.'
              ].join('\n')
            });

  # ─────────────────────────────────────────────────────────────────────────────
  # CUSTOM — repository_dispatch
  # Bring your own agent: this emits an event a listener workflow in THIS repo consumes.
  # `copilot` routes here too — wire GitHub Copilot up with github/gh-aw in your listener.
  # repository_dispatch is not cross-repo; for an external agent, replace the
  # github-script step with a curl call to your endpoint.
  # ─────────────────────────────────────────────────────────────────────────────
  trigger-custom:
    if: |
      github.event.label.name == 'agent-ready' &&
      (vars.AGENT_PROVIDER == 'custom' || vars.AGENT_PROVIDER == 'copilot')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Dispatch agent-ready event
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'agent-ready',
              client_payload: {
                issue_number: context.payload.issue.number,
                issue_title: context.payload.issue.title,
                issue_body: context.payload.issue.body,
                issue_url: context.payload.issue.html_url,
                labels: context.payload.issue.labels.map(l => l.name)
              }
            });
            console.log(`Dispatched agent-ready event for issue #${context.payload.issue.number}`);
